<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

  <title>Advertisement Details | Vishvamitra</title>
  <meta name="description" content="View this featured business spotlight on Vishvamitra." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://vishvamitra.com/listing-details.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vishvamitra" />
  <meta property="og:title" content="Advertisement Details | Vishvamitra" />
  <meta property="og:description" content="Featured business spotlight on Vishvamitra." />
  <meta property="og:url" content="https://vishvamitra.com/listing-details.html" />
  <meta property="og:image" content="https://vishvamitra.com/assets/images/banner.svg" />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@vishvamitra_services" />
  <meta name="twitter:title" content="Advertisement Details | Vishvamitra" />
  <meta name="twitter:description" content="Featured business spotlight on Vishvamitra." />
  <meta name="twitter:image" content="https://vishvamitra.com/assets/images/banner.svg" />
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

<header><div id="navbar-root"></div></header>

<!-- SKELETON (reuses listing-details skeleton styles) -->
<div id="skeletonWrap" class="ld-skeleton-wrap">
  <div class="ld-skeleton-banner"></div>
  <div class="ld-skeleton-body">
    <div class="ld-skeleton-line" style="width:55%;height:18px;"></div>
    <div class="ld-skeleton-line" style="width:35%;height:13px;margin-top:10px;"></div>
    <div class="ld-skeleton-line" style="width:75%;height:13px;margin-top:10px;"></div>
    <div class="ld-skeleton-line" style="width:45%;height:13px;margin-top:10px;"></div>
  </div>
</div>

<!-- MAIN AD DETAIL — reuses listing-details.html's .ld-* layout -->
<article id="adWrap" style="display:none;">

  <!-- BANNER -->
  <div class="ld-banner">
    <div class="ld-banner-bg" id="bannerBg"></div>
    <div class="ld-banner-overlay"></div>
    <div class="ld-banner-content">
      <div class="ld-banner-left">
        <span class="ld-type-badge paid" id="bannerType">Featured Business</span>
        <h1 class="ld-biz-name" id="bannerName"></h1>
        <p class="ld-banner-sub" id="bannerTagline"></p>
        <p class="ld-banner-sub" id="bannerPhone"></p>
      </div>
      <div class="ld-banner-actions">
        <a id="callBtnBanner" class="ld-btn-call" href="#">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.39 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Call Now
        </a>
        <a id="visitBtnBanner" class="ld-btn-back" href="#" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Visit Website
        </a>
        <a href="services.html" class="ld-btn-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          All Services
        </a>
      </div>
    </div>
  </div>

  <!-- PHOTO STRIP -->
  <div class="ld-photo-strip" id="photoStrip"></div>

  <!-- TAB BAR -->
  <div class="ld-tabs-bar">
    <div class="ld-tabs-inner">
      <button class="ld-tab active" data-tab="overview">Overview</button>
      <button class="ld-tab" data-tab="contact">Contact</button>
    </div>
  </div>

  <!-- BODY -->
  <div class="ld-body">

    <!-- SIDEBAR -->
    <aside class="ld-sidebar">
      <div class="ld-sidebar-section" id="sidePhoneSection">
        <div class="ld-sidebar-label">Phone</div>
        <div class="ld-sidebar-value">
          <a class="ld-phone-link" id="sidePhone" href="#"></a>
        </div>
      </div>
      <div class="ld-sidebar-section">
        <div class="ld-sidebar-label">Category</div>
        <div class="ld-sidebar-value" id="sideCategory"></div>
      </div>
      <div class="ld-sidebar-section">
        <div class="ld-sidebar-label">Ad Type</div>
        <div class="ld-sidebar-value"><span class="ld-type-pill paid" id="sideTypePill"></span></div>
      </div>
      <div class="ld-sidebar-section">
        <div class="ld-sidebar-label">Status</div>
        <div class="ld-sidebar-value"><span class="ld-active-dot"></span> Active</div>
      </div>
    </aside>

    <!-- MAIN PANEL -->
    <main class="ld-main" id="main-content">

      <!-- Overview tab -->
      <div id="panelOverview">
        <div class="ld-card">
          <h2 class="ld-card-title">About</h2>
          <p class="ld-description" id="mainDesc"></p>
        </div>
      </div>

      <!-- Contact tab -->
      <div id="panelContact" style="display:none;">
        <div class="ld-card">
          <h2 class="ld-card-title">Contact Details</h2>
          <div class="ld-contact-list">
            <div class="ld-contact-row" id="cRowPhone">
              <span class="ld-contact-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.39 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </span>
              <a class="ld-contact-link" id="cPhone" href="#"></a>
            </div>
            <div class="ld-contact-row" id="cRowEmail">
              <span class="ld-contact-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
              </span>
              <a class="ld-contact-link" id="cEmail" href="#"></a>
            </div>
            <div class="ld-contact-row" id="cRowLink">
              <span class="ld-contact-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              </span>
              <a class="ld-contact-link" id="cLink" href="#" target="_blank" rel="noopener noreferrer">Visit website</a>
            </div>
            <div class="ld-contact-row">
              <span class="ld-contact-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
              </span>
              <span id="cCategory"></span>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</article>

<!-- ERROR STATE -->
<div id="errorWrap" style="display:none;" class="ld-error-wrap">
  <p class="ld-error-msg">Advertisement not found or no longer active.</p>
  <a href="services.html" class="btn-primary">Browse Services</a>
</div>

<!-- Lightbox -->
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:none;align-items:center;justify-content:center;cursor:zoom-out;" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button id="lightboxClose" style="position:absolute;top:20px;right:24px;background:none;border:none;color: var(--color-on-primary);font-size:32px;cursor:pointer;line-height:1;" aria-label="Close">&times;</button>
  <img id="lightboxImg" src="" alt="" style="max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);object-fit:contain;" />
</div>

<script type="module" src="../scripts/navbar.js"></script>
<script type="module" src="../scripts/auth.js"></script>
<script type="module">
  import { getAdById }                from "../scripts/ads.js";
  import { toUserMessage, showToast } from "../scripts/utils.js";
  import { reportError }              from "../scripts/core/errors.js";
  import {
    applyPageMeta,
    canonicalUrl,
    absoluteAssetUrl,
  } from "../scripts/seo-config.js";

  const params   = new URLSearchParams(location.search);
  const adId     = params.get("id");
  const skeleton = document.getElementById("skeletonWrap");
  const wrap     = document.getElementById("adWrap");
  const errWrap  = document.getElementById("errorWrap");

  const $ = id => document.getElementById(id);
  function txt(id, v) { const el = $(id); if (el) el.textContent = v; }
  function show(el)   { el.style.display = ""; }
  function hide(el)   { el.style.display = "none"; }

  function formatCategory(cat) {
    if (!cat) return "General";
    return String(cat).replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }

  if (!adId) {
    hide(skeleton); show(errWrap);
    applyPageMeta({ robots: "noindex, nofollow" });
  } else {
    let ad = null;
    try {
      ad = await getAdById(adId);
    } catch (err) {
      reportError("adDetails.fetch", err);
      showToast(toUserMessage(err), { kind: "error" });
    }

    hide(skeleton);

    // Only reachable ads are ones that are currently active — matches
    // listing-details.html's `status !== "active"` gate.
    if (!ad || ad.active !== true) {
      show(errWrap);
      applyPageMeta({ robots: "noindex, nofollow" });
    } else {
      const businessName = String(ad.businessName || "").trim();
      const title         = String(ad.title || "").trim();
      const displayName   = businessName || title || "Featured Business";
      const tagline       = businessName && title && businessName.toLowerCase() !== title.toLowerCase()
        ? title
        : "";

      const pageTitle = `${displayName} | Vishvamitra`;
      const pageDesc  = (ad.description || `${displayName} — featured business spotlight on Vishvamitra.`).slice(0, 160);
      const pageUrl   = canonicalUrl(`listing-details.html?id=${adId}`);
      const ogImage   = ad.url || absoluteAssetUrl("/assets/images/banner.svg");

      document.title = pageTitle;
      applyPageMeta({
        title: pageTitle,
        description: pageDesc,
        url: pageUrl,
        image: ogImage,
        type: "website",
        robots: "noindex, follow",
      });

      txt("bannerName", displayName);

      const taglineEl = $("bannerTagline");
      if (tagline) taglineEl.textContent = tagline; else hide(taglineEl);

      if (ad.phone) txt("bannerPhone", ad.phone);
      else hide($("bannerPhone"));

      const callBtn = $("callBtnBanner");
      if (ad.phone) callBtn.href = `tel:${ad.phone}`;
      else hide(callBtn);

      const visitBtn = $("visitBtnBanner");
      if (ad.link) visitBtn.href = ad.link;
      else hide(visitBtn);

      // Banner background: image/video ads show their media;
      // text ads fall back to the branded gradient (same fallback
      // rule listing-details.html already uses for listings with no photo).
      if (ad.url && ad.type !== "video") $("bannerBg").style.backgroundImage = `url('${ad.url}')`;

      // Photo strip
      const strip = $("photoStrip");
      if (ad.url && ad.type === "video") {
        strip.innerHTML = `
          <div class="ld-photo-item">
            <video src="${ad.url}" style="height:120px;width:auto;max-width:220px;object-fit:cover;display:block;" muted playsinline controls></video>
          </div>`;
      } else if (ad.url) {
        strip.innerHTML = `
          <div class="ld-photo-item">
            <img src="${ad.url}" alt="${displayName}" loading="eager" fetchpriority="high" decoding="async"/>
          </div>`;
      } else {
        strip.classList.add("empty");
      }

      txt("sideCategory", formatCategory(ad.category));
      const pill = $("sideTypePill");
      pill.textContent = ad.type === "video" ? "Video Ad" : ad.type === "text" ? "Text Ad" : "Image Ad";

      if (ad.phone) {
        $("sidePhone").textContent = ad.phone;
        $("sidePhone").href        = `tel:${ad.phone}`;
      } else {
        hide($("sidePhoneSection"));
      }

      txt("mainDesc", ad.description || "No description provided for this advertisement.");

      if (ad.phone) {
        $("cPhone").textContent = ad.phone;
        $("cPhone").href        = `tel:${ad.phone}`;
      } else {
        hide($("cRowPhone"));
      }

      if (ad.email) {
        $("cEmail").textContent = ad.email;
        $("cEmail").href        = `mailto:${ad.email}`;
      } else {
        hide($("cRowEmail"));
      }

      if (ad.link) {
        $("cLink").href = ad.link;
      } else {
        hide($("cRowLink"));
      }

      txt("cCategory", formatCategory(ad.category));

      show(wrap);
    }
  }

  // Lightbox for photo strip images
  document.getElementById("photoStrip").addEventListener("click", (e) => {
    const img = e.target.closest(".ld-photo-item img");
    if (!img) return;
    const lb    = document.getElementById("lightbox");
    const lbImg = document.getElementById("lightboxImg");
    lbImg.src = img.src;
    lbImg.alt = img.alt;
    lb.style.display = "flex";
    document.body.style.overflow = "hidden";
  });

  function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
    document.body.style.overflow = "";
  }

  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  document.getElementById("lightbox").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });

  // Tab switching
  document.querySelectorAll(".ld-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".ld-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const overview = $("panelOverview");
      const contact  = $("panelContact");
      tab.dataset.tab === "overview" ? (show(overview), hide(contact)) : (hide(overview), show(contact));
    });
  });
</script>

</body>
</html>
